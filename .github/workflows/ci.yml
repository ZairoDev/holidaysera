name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values for compile-time / prerender only — not real secrets.
env:
  MONGO_URL: mongodb://127.0.0.1:27017/holidaysera-ci
  JWT_SECRET: ci-jwt-secret-not-for-production-use
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/holidaysera-ci
          JWT_SECRET: ci-jwt-secret-not-for-production-use
          NEXT_PUBLIC_APP_URL: http://localhost:3000
