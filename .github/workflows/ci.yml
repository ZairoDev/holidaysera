name: Deploy to VPS (Near Zero Downtime)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable verbose debug logging (safe; does not print secrets)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug (context + secrets configured)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Repo: ${{ github.repository }}"
          echo "Host configured: ${{ secrets.VPS_HOST != '' }}"
          echo "User configured: ${{ secrets.VPS_USERNAME != '' }}"
          echo "Key configured: ${{ secrets.VPS_SSH_KEY != '' }}"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Starting Deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            DEPLOY_DIR="/var/www/holidaysera"
            NEW_BUILD_DIR="/var/www/holidaysera_new_build"
            OLD_DIR="/var/www/holidaysera_old"
            PM2_APP_NAME="holidaysera"
            APP_PORT=3001
            REPO_URL="https://github.com/Zairodev/holidaysera.git"

            echo "Current PM2 Status:"
            sudo -u jenkins pm2 list || true

            echo ""
            echo "Cleaning previous build directory..."
            rm -rf ${NEW_BUILD_DIR}
            mkdir -p ${NEW_BUILD_DIR}

            echo ""
            echo "Cloning latest code..."
            git clone --depth 1 --branch main ${REPO_URL} ${NEW_BUILD_DIR}

            cd ${NEW_BUILD_DIR}

            echo ""
            echo "Copying environment files..."

            if [ -f "${DEPLOY_DIR}/.env.local" ]; then
              cp "${DEPLOY_DIR}/.env.local" .
            fi

            if [ -f "${DEPLOY_DIR}/.env.production" ]; then
              cp "${DEPLOY_DIR}/.env.production" .
            fi

            echo ""
            echo "Installing dependencies..."
            npm ci

            echo ""
            echo "Building application..."
            npm run build

            if [ ! -d ".next" ]; then
              echo "ERROR: Build failed (.next missing)"
              exit 1
            fi

            echo ""
            echo "Build completed successfully"
            echo "Build size: $(du -sh .next | cut -f1)"

            echo ""
            echo "Swapping releases..."

            rm -rf ${OLD_DIR}
            mv ${DEPLOY_DIR} ${OLD_DIR}
            mv ${NEW_BUILD_DIR} ${DEPLOY_DIR}

            echo ""
            echo "Reloading PM2..."

            sudo -u jenkins pm2 reload ${PM2_APP_NAME} --update-env || \
            sudo -u jenkins pm2 restart ${PM2_APP_NAME} --update-env

            sudo -u jenkins pm2 save

            echo ""
            echo "Waiting for application..."
            sleep 15

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${APP_PORT} || echo "000")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Health check failed. HTTP Status: $HTTP_CODE"

              echo "Rolling back..."

              rm -rf ${DEPLOY_DIR}
              mv ${OLD_DIR} ${DEPLOY_DIR}

              sudo -u jenkins pm2 restart ${PM2_APP_NAME}
              exit 1
            fi

            echo ""
            echo "Deployment successful"

            rm -rf ${OLD_DIR}

            echo "Current commit:"
            cd ${DEPLOY_DIR}
            git rev-parse --short HEAD

            echo ""
            echo "PM2 Status:"
            sudo -u jenkins pm2 list

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deployment Finished Successfully"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
