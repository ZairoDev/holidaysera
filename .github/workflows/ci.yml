name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGO_URL: mongodb://127.0.0.1:27017/holidaysera-ci
  JWT_SECRET: ci-jwt-secret-not-for-production-use
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/holidaysera-ci
          JWT_SECRET: ci-jwt-secret-not-for-production-use
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: |
      needs.build.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )

    steps:
      - name: Check VPS secrets
        id: vps_secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USERNAME }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add repository secrets VPS_HOST, VPS_USERNAME, and VPS_SSH_KEY to enable automatic deployment."
          fi

      - name: Deploy to VPS
        if: steps.vps_secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Starting zero-downtime deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            DEPLOY_DIR="/var/www/holidaysera"
            NEW_BUILD_DIR="/var/www/holidaysera_new_build"
            PM2_APP_NAME="holidaysera"
            APP_PORT=3001
            REPO_URL="https://github.com/Zairodev/holidaysera.git"

            pm2 list | grep ${PM2_APP_NAME} || echo "App not running"

            sudo rm -rf ${NEW_BUILD_DIR}
            sudo mkdir -p ${NEW_BUILD_DIR}
            sudo chown -R jenkins:jenkins ${NEW_BUILD_DIR}

            cd ${NEW_BUILD_DIR}
            git clone --depth 1 --branch main ${REPO_URL} .
            sudo chown -R jenkins:jenkins ${NEW_BUILD_DIR}

            if [ -f "${DEPLOY_DIR}/.env.production" ]; then
              cp "${DEPLOY_DIR}/.env.production" .
            fi
            if [ -f "${DEPLOY_DIR}/.env.local" ]; then
              cp "${DEPLOY_DIR}/.env.local" .
            fi
            if [ ! -f ".env.local" ] && [ -f ".env.production" ]; then
              cp .env.production .env.local
            fi

            if [ -f ".env.local" ]; then
              set -a
              . ./.env.local
              set +a
            elif [ -f ".env.production" ]; then
              set -a
              . ./.env.production
              set +a
            fi

            if [ -z "${MONGO_URL:-}" ]; then
              echo "ERROR: MONGO_URL is not set in .env.local on the server"
              exit 1
            fi
            if [ -z "${JWT_SECRET:-}" ]; then
              echo "ERROR: JWT_SECRET is not set in .env.local on the server"
              exit 1
            fi

            export NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-http://localhost:${APP_PORT}}"

            npm ci
            sudo rm -rf .next
            npm run build

            if [ ! -d ".next" ]; then
              echo "Build output missing (.next)"
              exit 1
            fi

            sudo chown -R jenkins:jenkins ${NEW_BUILD_DIR}

            pm2 delete ${PM2_APP_NAME} 2>/dev/null || true
            TEMP_OLD="${DEPLOY_DIR}_old"
            sudo rm -rf ${TEMP_OLD}
            sudo mv ${DEPLOY_DIR} ${TEMP_OLD} 2>/dev/null || true
            sudo mv ${NEW_BUILD_DIR} ${DEPLOY_DIR}
            sudo chown -R jenkins:jenkins ${DEPLOY_DIR}

            cd ${DEPLOY_DIR}
            pm2 start npm --name ${PM2_APP_NAME} --update-env -- start
            pm2 save

            sleep 15
            HEALTH_OK=false
            if pm2 describe ${PM2_APP_NAME} | grep -q "status.*online"; then
              sleep 10
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${APP_PORT}" || echo "000")
              if [ "${HTTP_CODE}" != "000" ]; then
                HEALTH_OK=true
              fi
            fi

            if [ "${HEALTH_OK}" = false ]; then
              echo "Health check failed"
              pm2 logs ${PM2_APP_NAME} --lines 30 --nostream || true
              exit 1
            fi

            sudo rm -rf ${TEMP_OLD}
            echo "Deployment successful"
            pm2 list
